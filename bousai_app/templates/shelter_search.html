{% extends "base.html" %}

{% block title %}避難所検索 | 防災アプリ{% endblock %}

{% block content %}
<style>
	.search-page {
		width: min(1080px, calc(100% - 32px));
		margin: 28px auto 64px;
	}
	.sr-only {
		position: absolute;
		width: 1px;
		height: 1px;
		padding: 0;
		margin: -1px;
		overflow: hidden;
		clip: rect(0, 0, 0, 0);
		white-space: nowrap;
		border: 0;
	}
	.search-title {
		margin: 0 0 14px;
		color: #26364c;
		font-size: 1.4rem;
		font-weight: 800;
	}
	.search-map {
		position: relative;
		height: 320px;
		overflow: hidden;
		border: 1px solid #cfd6df;
		border-radius: 4px;
	}
	.search-map .leaflet-container { height: 100%; }
	.location-button {
		position: absolute;
		top: 10px;
		right: 10px;
		z-index: 1000;
		min-width: 44px;
		min-height: 38px;
		border: 1px solid #b8c0ca;
		border-radius: 3px;
		color: #24415b;
		background: #fff;
		box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
		font: inherit;
		cursor: pointer;
	}
	.location-button:hover { color: #2f61b5; background: #f1f6fb; }
	.search-controls {
		display: grid;
		grid-template-columns: minmax(280px, 430px) 180px;
		align-items: center;
		justify-content: center;
		gap: 14px;
		margin: 30px auto 22px;
		padding: 18px;
		border: 1px solid #e1e8f0;
		border-radius: 10px;
		background: #f7faff;
		box-shadow: 0 4px 16px rgba(36, 65, 91, .06);
	}
	.district-select,
	.search-button,
	.all-shelters-link {
		min-height: 48px;
		border: 1px solid #b8c0ca;
		border-radius: 3px;
		font: inherit;
	}
	.district-select {
		padding: 0 14px;
		color: #26364c;
		background: #fff;
		font-weight: 500;
		cursor: pointer;
	}
	.district-select:focus,
	.search-button:focus,
	.location-button:focus { outline: 3px solid rgba(47, 97, 181, .22); outline-offset: 1px; }
	.search-button {
		border-color: #2f61b5;
		color: #fff;
		background: #2f61b5;
		font-weight: 700;
		cursor: pointer;
	}
	.search-button:hover { background: #2857a5; }
	.all-shelters-link {
		display: grid;
		place-items: center;
		grid-column: 1 / -1;
		justify-self: center;
		width: 240px;
		color: #2f61b5;
		background: #fff;
		font-size: .9rem;
		font-weight: 700;
		text-align: center;
		text-decoration: none;
	}
	.all-shelters-link:hover { color: #2857a5; border-color: #2f61b5; background: #f1f6fb; }
	.search-lower {
		display: grid;
		grid-template-columns: 1fr;
		gap: 34px;
		align-items: start;
	}
	.shelter-list {
		margin: 0;
		padding: 0;
		overflow: hidden;
		border: 1px solid #222;
		list-style: none;
	}
	.shelter-list a,
	.shelter-list-empty {
		display: block;
		padding: 8px 14px;
		border-bottom: 1px solid #222;
		color: #333;
		background: #fff;
		text-decoration: none;
	}
	.shelter-list li:last-child a,
	.shelter-list li:last-child .shelter-list-empty { border-bottom: 0; }
	.shelter-list a:hover { color: #2459ad; background: #eef5fb; }
	.filter-options { padding-top: 8px; color: #4d5968; }
	.filter-options {
		width: min(100%, 500px);
		border: 0;
		justify-self: center;
		margin: 0;
		text-align: center;
	}
	.filter-options legend {
		width: 100%;
		margin-bottom: 12px;
		color: #26364c;
		font-size: 1rem;
		font-weight: 800;
		text-align: center;
	}
	.filter-options label {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		margin: 0 4px 10px;
		padding: 8px 12px;
		border: 1px solid #d8e1eb;
		border-radius: 999px;
		background: #fff;
		font-size: .9rem;
		cursor: pointer;
	}
	.filter-options label:has(input:checked) { border-color: #2f61b5; color: #2857a5; background: #eef5ff; }
	.filter-options input { accent-color: #2f61b5; }
	.shelter-label {
		padding: 2px 7px;
		border: 1px solid #e5b2ad;
		border-radius: 4px;
		color: #84261f;
		background: #fff;
		font-size: .75rem;
		font-weight: 700;
		box-shadow: 0 1px 3px rgba(0, 0, 0, .16);
	}
	.shelter-marker {
		color: #e33424;
		font-size: 2rem;
		filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
	}
	@media (max-width: 760px) {
		.search-controls { grid-template-columns: 1fr; margin-top: 24px; }
		.all-shelters-link { grid-column: auto; width: 220px; }
		.search-lower { grid-template-columns: 1fr; gap: 22px; }
		.shelter-list { max-width: 300px; }
		.search-map { height: 230px; }
	}
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<div class="search-page">
	<h2 class="search-title">避難所検索</h2>

	<section id="searchMap" class="search-map" aria-label="避難所マップ">
		<p id="locationStatus" class="sr-only" aria-live="polite">現在地を取得しています</p>
		<button id="locationButton" class="location-button" type="button" title="現在地を表示" aria-label="現在地を表示">
			<i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i>
		</button>
	</section>

	<form class="search-controls" method="get" action="/search_results">
		<label for="district" class="sr-only">町名を選択</label>
		<select class="district-select" id="district" name="district">
			<option value="">選択しない</option>
			{% for row, row_districts in districts.items() %}
			<optgroup label="{{ row }}">
				{% for district, reading in row_districts %}
				<option value="{{ district }}">{{ district }}（{{ reading }}）</option>
				{% endfor %}
			</optgroup>
			{% endfor %}
		</select>
		<button class="search-button" type="submit">検索</button>
		<a class="all-shelters-link" href="/all_shelters">空きのある施設だけ表示</a>
	</form>

	<div class="search-lower">
		<fieldset class="filter-options">
			<legend>施設の条件</legend>
			<label><input type="checkbox" name="barrier_free"> バリアフリー対応</label>
			<label><input type="checkbox" name="pets"> ペット可</label>
			<label><input type="checkbox" name="infants"> 乳幼児対応</label>
			<label><input type="checkbox" name="parking"> 駐車場あり</label>
		</fieldset>
	</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
	document.addEventListener('DOMContentLoaded', function () {
		const fallbackLocation = [40.8220, 140.7474];
		const shelters = {{ shelters | tojson }};
		const map = L.map('searchMap').setView(fallbackLocation, 12);
		const locationStatus = document.getElementById('locationStatus');
		const locationButton = document.getElementById('locationButton');
		let currentLocationMarker;
		let accuracyCircle;

		L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			attribution: '&copy; OpenStreetMap contributors',
			referrerPolicy: 'strict-origin-when-cross-origin'
		}).addTo(map);

		const shelterIcon = L.divIcon({
			className: 'shelter-marker',
			html: '<i class="fa-solid fa-location-dot" aria-hidden="true"></i>',
			iconSize: [30, 36],
			iconAnchor: [15, 34]
		});
		shelters.forEach(function (shelter) {
			if (!Number.isFinite(shelter.latitude) || !Number.isFinite(shelter.longitude)) return;
			L.marker([shelter.latitude, shelter.longitude], { icon: shelterIcon })
				.addTo(map)
				.bindTooltip(shelter.name, {
					permanent: true,
					direction: 'right',
					offset: [8, -16],
					className: 'shelter-label'
				});
		});

		function showCurrentLocation(position) {
			const location = [position.coords.latitude, position.coords.longitude];
			const accuracy = position.coords.accuracy;

			map.setView(location, 15);
			if (currentLocationMarker) {
				currentLocationMarker.setLatLng(location);
				accuracyCircle.setLatLng(location).setRadius(accuracy);
				locationStatus.textContent = '現在地を地図上に表示しています';
				return;
			}

			currentLocationMarker = L.circleMarker(location, {
				radius: 9,
				color: '#fff',
				weight: 2,
				fillColor: '#1976d2',
				fillOpacity: 1
			})
				.addTo(map)
				.bindTooltip('現在地', { direction: 'top', offset: [0, -8] });
			accuracyCircle = L.circle(location, {
				color: '#1976d2',
				fillColor: '#42a5f5',
				fillOpacity: 0.16,
				radius: accuracy
			}).addTo(map);
			locationStatus.textContent = '現在地を地図上に表示しています';
		}

		function requestCurrentLocation() {
			if (!('geolocation' in navigator)) {
				locationStatus.textContent = 'このブラウザでは現在地を取得できません';
				return;
			}

			locationStatus.textContent = '現在地を取得しています';
			navigator.geolocation.getCurrentPosition(
				showCurrentLocation,
				function () {
					locationStatus.textContent = '現在地を取得できませんでした。位置情報を許可してください';
				},
				{ enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
			);
		}

		locationButton.addEventListener('click', requestCurrentLocation);
		requestCurrentLocation();
	});
</script>

{% endblock %}
