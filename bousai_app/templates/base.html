<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --blue: #2f61b5;
      --blue-dark: #2857a5;
      --ink: #405064;
      --muted: #718096;
      --line: #edf0f5;
      --surface: #ffffff;
      --page: #ffffff;
      --success: #199c4b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
      line-height: 1.7;
    }
    .site-header {
      position: relative;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 0 max(24px, calc((100% - 1180px) / 2));
      color: #fff;
      background: var(--blue);
      box-shadow: 0 2px 9px rgba(23, 69, 143, .18);
    }
    .brand {
      color: inherit;
      font-size: 1.42rem;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: .04em;
    }
    .menu-button {
      border: 0;
      padding: 7px 8px;
      color: #fff;
      background: transparent;
      font-size: 1.45rem;
      line-height: 1;
      cursor: pointer;
    }
    .site-nav {
      display: none;
      position: fixed;
      z-index: 2100;
      top: 70px;
      right: max(24px, calc((100% - 1180px) / 2));
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(26, 48, 80, .18);
    }
    .site-nav.is-open { display: grid; }
    .site-nav a {
      padding: 8px 14px;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
    }
    .site-nav a:hover { color: var(--blue); background: #f1f5fb; }
    main { min-height: calc(100vh - 70px); }
    .page-shell {
      width: min(910px, calc(100% - 32px));
      margin: 32px auto 64px;
    }
    .home-card {
      margin-bottom: 34px;
      padding: 26px 28px 30px;
      background: var(--surface);
      border: 1px solid #edf1f6;
      border-radius: 15px;
      box-shadow: 0 5px 22px rgba(39, 54, 74, .07);
    }
    .section-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--blue);
      font-size: 1.3rem;
      font-weight: 800;
    }
    .section-heading .icon { font-size: 1.25rem; }
    #shelterMap { height: 365px; border-radius: 12px; overflow: hidden; }
    .weather-card { background: #f8f9fb; border-radius: 12px; padding: 20px; }
    .weather-header { justify-content: space-between; }
    .refresh-label { color: var(--success); font-size: .95rem; font-weight: 700; }
    .weather-status { color: var(--success); font-weight: 700; }
    .weather-status .fa-circle-check { margin-right: 6px; }
    .weather-card .fa-location-dot { color: #586879; margin-right: 5px; }
    .weather-meta { color: var(--muted); font-size: .9rem; }
    @media (max-width: 600px) {
      .site-header { padding: 0 16px; }
      .site-nav { right: 16px; }
      .page-shell { width: min(100% - 20px, 910px); margin-top: 20px; }
      .home-card { padding: 20px 16px; margin-bottom: 20px; }
      .section-heading { font-size: 1.1rem; }
      #shelterMap { height: 280px; }
      .weather-header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">防災アプリ</a>
    <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button>
  </header>
  <nav class="site-nav" aria-label="メインメニュー">
    <a href="/">ホーム</a>
    <a href="/shelter_search">避難所検索</a>
    <a href="/shelter_register">避難所登録</a>
    <a href="/board">指示・発信ボード</a>
    {% if session.logged_in %}
      <a href="/logout">ログアウト</a>
    {% else %}
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const siteNav = document.querySelector('.site-nav');
    menuButton.addEventListener('click', () => {
      const isOpen = siteNav.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', isOpen);
    });
  </script>
</body>
</html>
